[build-system] 
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "bank_churn_predictions"
version = "0.0.1"
description = "Machine learning system for predicting customer churn, testing multiple models and giving business reccomendations"
authors = [
  { name = "Ravindu Goonewardena" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["bank_churn_predictions"]
include = ["pyproject.toml", "bank_churn_predictions/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["bank_churn_predictions"]
force-sort-within-sections = true

